<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FBF6F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Familia">
<title>Familia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-icon-v2-180.png">
<link rel="stylesheet" href="styles.css?v=16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="theme.css?v=16">
</head>
<body>
<div id="shell">
  <aside class="side" id="side">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="4"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></span><b class="lbl">Familia</b></div>
    <button class="newbtn" data-act="add" aria-label="Agregar"><span class="plus"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="lbl">Agregar</span></button>
    <nav class="menu">
    <button data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="4"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg><span class="lbl">Plan</span></button>
    <button data-tab="tiempo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 3h5"/></svg><span class="lbl">Tiempo</span></button>
    <button data-tab="logros"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.9z"/></svg><span class="lbl">Logros</span></button>
    <button data-tab="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="9.5" cy="17" r="2.3"/></svg><span class="lbl">Ajustes</span></button>
    </nav>
    <div class="members" id="members"></div>
  </aside>
  <div id="app">
  <header class="topbar">
    <div class="topbar-row">
      <div class="period">
        <h1 id="periodTitle"></h1>
        <span id="periodSub" class="sub"></span> <i id="syncdot" class="syncdot o"></i>
      </div>
      <div class="nav">
        <button class="icon-btn" data-act="prev" aria-label="Anterior"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></button>
        <button class="pill" data-act="today">Hoy</button>
        <button class="icon-btn" data-act="next" aria-label="Siguiente"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div class="topbar-row tools" id="planTools">
      <div class="seg" id="viewSeg">
        <button data-view="day">Día</button>
        <button data-view="week">Semana</button>
        <button data-view="month">Mes</button>
      </div>
      <div class="layers" id="layers"></div>
    </div>
  </header>

  <main id="main"></main>

  <button class="fab" id="fab" data-act="add" aria-label="Agregar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <aside class="aside" id="aside"></aside>
</div>

<nav class="tabbar">
    <button data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="4"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg><span class="lbl">Plan</span></button>
    <button data-tab="tiempo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 3h5"/></svg><span class="lbl">Tiempo</span></button>
    <button data-tab="logros"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.9z"/></svg><span class="lbl">Logros</span></button>
    <button data-tab="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="9.5" cy="17" r="2.3"/></svg><span class="lbl">Ajustes</span></button>
</nav>

<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status"></div>

<script src="config.js?v=16"></script>
<script src="vendor/supabase.js"></script>
<script src="supabase-adapter.js?v=16"></script>
<script src="icons.js?v=16"></script>
<script src="app.js?v=16"></script>
</body>
</html>
